 r0=r0 r1=r1 r2=r2 c0=c0 c1=c1 BusA=BusA BusB=BusB NoOp=NoOp Empty=Empty NoReplica=NoReplica
 Replicas={r0,r1,r2} ReplicaOrder<-ReplicaOrderValue Clients={c0,c1} ClientOrder<-ClientOrderValue
 MaxSlot=3 MaxView=1 RetainWindow=0 MetadataWindow=1 MaxFetchAttempts=3
