SPECIFICATION MCSpec

CONSTANTS
  r0=r0 r1=r1 r2=r2 c0=c0 c1=c1
  BusA=BusA BusB=BusB NoOp=NoOp Empty=Empty NoReplica=NoReplica
  Replicas={r0,r1,r2} ReplicaOrder<-ReplicaOrderValue
  Clients={c0,c1} ClientOrder<-ClientOrderValue
  MaxSlot=4 MaxView=2 MaxWindow=2 MetadataWindow=1
  MaxFetchAttempts=3 RetainWindow=0 DurableReplicas={r0,r1,r2}
  ScheduleRequestLimit=4 BusLimit=5 SyncLimit=3 LossLimit=2
  DisconnectLimit=2 ViewChangeLimit=3 DonorFailureLimit=1 PruneLimit=2
  ControlReportLimit=4 DataFailureLimit=1 MaxMsgBufferLimit=10

  RequestScheduleWindow <- MCRequestScheduleWindow
  ClientSendsBus <- MCClientSendsBus
  SendSyncPrepare <- MCSendSyncPrepare
  LoseMessage <- MCLoseMessage
  Disconnect <- MCDisconnect
  BeginViewChange <- MCBeginViewChange
  PruneCommittedSlot <- MCPruneCommittedSlot
  HandleControlReport <- MCHandleControlReport
  FailDataConnection <- MCFailDataConnection

SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint

INVARIANTS
  MCTypeOK
  ExecutedPrefixBounded
  CommittedFrontierHasHistory
  PreparedWindowInHistory

\* Scenario invariants intentionally live in MC_hunt_*.cfg:
\* SlotOwnershipUnique, ScheduleHistoryCompatible, SlotAgreement,
\* StablePrefixesAgree, StableHasMatchingCertificate,
\* CommittedRequestSurvivesViewChange, NoCommittedBusBecomesNoOp,
\* DurableStateMatchesCanonical, CanonicalDataHasRecoverableSource,
\* PauseRequiresCertifiedView, PruningRespectsStableFrontier.
