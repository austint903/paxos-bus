SPECIFICATION MCSpec

CONSTANTS
    r0 = r0
    r1 = r1
    r2 = r2
    c0 = c0
    c1 = c1
    BusA = BusA
    BusB = BusB
    NoOp = NoOp
    Empty = Empty
    NoReplica = NoReplica
    Replicas = {r0, r1, r2}
    ReplicaOrder <- ReplicaOrderValue
    Clients = {c0, c1}
    ClientOrder <- ClientOrderValue
    MaxSlot = 3
    MaxView = 2
    RetainWindow = 0
    MetadataWindow = 1
    MaxFetchAttempts = 3
    DurableReplicas = {r0, r1, r2}
    BusLimit = 4
    SyncLimit = 3
    LossLimit = 2
    ConnectionLimit = 2
    ViewChangeLimit = 3
    DonorFailureLimit = 1
    PruneLimit = 2
    ReboardLimit = 1
    RegistrationLimit = 2
    MaxMsgBufferLimit = 10

    ClientAnnouncesSchedule <- MCClientAnnouncesSchedule
    ClientSendsBus <- MCClientSendsBus
    SendSyncPrepare <- MCSendSyncPrepare
    Disconnect <- MCDisconnect
    LoseMessage <- MCLoseMessage
    BeginViewChange <- MCBeginViewChange
    PruneCommittedSlot <- MCPruneCommittedSlot
    ClientReboards <- MCClientReboards

SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint

INVARIANTS
    MCTypeOK
    ExecutedPrefixBounded
    DiskWriteOnce
    SlotAgreement
    StablePrefixesAgree
    Durability
    NoOpLogDurability
    Linearizability
    ReadyReplicaHasCompleteSchedule
    ReleasedOnlyAfterScheduleCommit
    NormalViewPreservesCommittedSchedule

\* Scenario invariants are intentionally enabled only in MC_hunt_*.cfg.
\* INVARIANTS CommittedRequestSurvivesViewChange
\* INVARIANTS CanonicalDataHasRecoverableSource
\* INVARIANTS DurableStateMatchesCanonical
\* INVARIANTS RequestExecutionUnique
\* INVARIANTS RequestIndexStable
\* INVARIANTS ScheduleOwnershipStable

ACTION_CONSTRAINT StableMonotonic
ACTION_CONSTRAINT ExecutionMonotonicOrRewind
