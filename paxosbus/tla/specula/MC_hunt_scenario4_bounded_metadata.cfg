SPECIFICATION MCSpec
CONSTANTS
 r0=r0 r1=r1 r2=r2 c0=c0 c1=c1 BusA=BusA BusB=BusB NoOp=NoOp Empty=Empty NoReplica=NoReplica
 Replicas={r0,r1,r2} ReplicaOrder<-ReplicaOrderValue Clients={c0,c1} ClientOrder<-ClientOrderValue
 MaxSlot=3 MaxView=0 RetainWindow=0 MetadataWindow=1 MaxFetchAttempts=3
 DurableReplicas={}
 BusLimit=4 SyncLimit=2 LossLimit=3 ConnectionLimit=0 ViewChangeLimit=0
 DonorFailureLimit=0 PruneLimit=2 ReboardLimit=1 RegistrationLimit=2 MaxMsgBufferLimit=8
 ClientAnnouncesSchedule <- MCClientAnnouncesSchedule ClientSendsBus<-MCClientSendsBus SendSyncPrepare<-MCSendSyncPrepare
 Disconnect<-MCDisconnect LoseMessage<-MCLoseMessage BeginViewChange<-MCBeginViewChange
 PruneCommittedSlot<-MCPruneCommittedSlot ClientReboards<-MCClientReboards
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint
INVARIANTS MCTypeOK Linearizability CanonicalDataHasRecoverableSource RequestExecutionUnique RequestIndexStable
